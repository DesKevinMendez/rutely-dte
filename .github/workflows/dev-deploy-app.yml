name: Dev Deploy App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dropplet-dev-digital-ocean
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_FAKER_LOCALE: ${{ vars.APP_FAKER_LOCALE }}
          APP_FALLBACK_LOCALE: ${{ vars.APP_FALLBACK_LOCALE }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_LOCALE: ${{ vars.APP_LOCALE }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_URL: ${{ vars.APP_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USERNAME: ${{ secrets.DROPLET_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: |
          for name in APP_DEBUG APP_ENV APP_FAKER_LOCALE APP_FALLBACK_LOCALE APP_KEY APP_LOCALE APP_NAME APP_URL DB_CONNECTION DB_DATABASE DB_HOST DB_PASSWORD DB_PORT DB_USERNAME DROPLET_HOST DROPLET_USERNAME SSH_PRIVATE_KEY VITE_APP_NAME; do
            test -n "${!name}" || { echo "Missing $name deployment configuration" >&2; exit 1; }
          done

      - name: Remove build-only artifacts
        run: rm -rf node_modules .git

      - name: Copy files to droplet
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '.'
          target: /opt/rutely-dte
          overwrite: true

      - name: Build and deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: APP_NAME,APP_ENV,APP_DEBUG,APP_KEY,APP_URL,APP_LOCALE,APP_FALLBACK_LOCALE,APP_FAKER_LOCALE,VITE_APP_NAME,DB_CONNECTION,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            cd /opt/rutely-dte
            export COMPOSE_PROJECT_NAME=rutely-dte-dev
            test -r /etc/ssl/cloudflare/rutely.biz.pem
            test -r /etc/ssl/cloudflare/rutely.biz.key

            umask 077
            cat > .env << EOF
            APP_NAME="$APP_NAME"
            APP_ENV=$APP_ENV
            APP_KEY=$APP_KEY
            APP_DEBUG=$APP_DEBUG
            APP_URL=$APP_URL

            APP_LOCALE=$APP_LOCALE
            APP_FALLBACK_LOCALE=$APP_FALLBACK_LOCALE
            APP_FAKER_LOCALE=$APP_FAKER_LOCALE
            VITE_APP_NAME="$VITE_APP_NAME"

            DB_CONNECTION=$DB_CONNECTION
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_DATABASE=$DB_DATABASE
            DB_USERNAME=$DB_USERNAME
            EOF

            docker compose -f docker-compose.dev.yml config -q
            docker compose -f docker-compose.dev.yml build
            docker compose -f docker-compose.dev.yml down --remove-orphans
            docker volume ls -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter label=com.docker.compose.volume=public-assets | xargs -r docker volume rm
            docker compose -f docker-compose.dev.yml up -d --wait db
            docker compose -f docker-compose.dev.yml run --rm app php artisan migrate --force
            docker compose -f docker-compose.dev.yml up -d
            docker compose -f docker-compose.dev.yml exec -T app php artisan optimize
            docker compose -f docker-compose.dev.yml ps
            docker image prune --all --force --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=app"
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          APP_LOCALE: ${{ vars.APP_LOCALE }}
          APP_FALLBACK_LOCALE: ${{ vars.APP_FALLBACK_LOCALE }}
          APP_FAKER_LOCALE: ${{ vars.APP_FAKER_LOCALE }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
