name: Dev Deploy App

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-deploy-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dropplet-dev-digital-ocean
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_FAKER_LOCALE: ${{ vars.APP_FAKER_LOCALE }}
          APP_FALLBACK_LOCALE: ${{ vars.APP_FALLBACK_LOCALE }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_LOCALE: ${{ vars.APP_LOCALE }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_URL: ${{ vars.APP_URL }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USERNAME: ${{ secrets.DROPLET_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: |
          for name in APP_DEBUG APP_ENV APP_FAKER_LOCALE APP_FALLBACK_LOCALE APP_KEY APP_LOCALE APP_NAME APP_URL DB_CONNECTION DB_DATABASE DB_HOST DB_PASSWORD DB_PORT DB_USERNAME DROPLET_HOST DROPLET_USERNAME SSH_PRIVATE_KEY VITE_APP_NAME; do
            test -n "${!name}" || { echo "Missing $name deployment configuration" >&2; exit 1; }
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build app image on GitHub Actions
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: rutely-dte-dev-app:${{ github.sha }}
          cache-from: type=gha,scope=rutely-dte-dev-app
          cache-to: type=gha,scope=rutely-dte-dev-app,mode=max

      - name: Package app image
        run: |
          set -euo pipefail
          docker save "rutely-dte-dev-app:${GITHUB_SHA}" | gzip -1 > rutely-dte-dev-app.tar.gz

      - name: Copy image and Compose files to droplet
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.dev.yml,docker/nginx/dev.conf,rutely-dte-dev-app.tar.gz'
          target: /opt/rutely-dte
          overwrite: true
          command_timeout: 30m

      - name: Load image and deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: APP_NAME,APP_ENV,APP_DEBUG,APP_KEY,APP_URL,APP_LOCALE,APP_FALLBACK_LOCALE,APP_FAKER_LOCALE,VITE_APP_NAME,APP_IMAGE_TAG,DB_CONNECTION,DB_HOST,DB_PORT,DB_DATABASE,DB_USERNAME,DB_PASSWORD
          script: |
            set -e
            cd /opt/rutely-dte
            export COMPOSE_PROJECT_NAME=rutely-dte-dev
            test -r /etc/ssl/cloudflare/rutely.biz.pem
            test -r /etc/ssl/cloudflare/rutely.biz.key

            umask 077
            cat > .env << EOF
            APP_NAME="$APP_NAME"
            APP_ENV=$APP_ENV
            APP_KEY=$APP_KEY
            APP_DEBUG=$APP_DEBUG
            APP_URL=$APP_URL

            APP_LOCALE=$APP_LOCALE
            APP_FALLBACK_LOCALE=$APP_FALLBACK_LOCALE
            APP_FAKER_LOCALE=$APP_FAKER_LOCALE
            VITE_APP_NAME="$VITE_APP_NAME"
            APP_IMAGE_TAG=$APP_IMAGE_TAG

            DB_CONNECTION=$DB_CONNECTION
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_DATABASE=$DB_DATABASE
            DB_USERNAME=$DB_USERNAME
            EOF

            docker load --input rutely-dte-dev-app.tar.gz
            rm -f rutely-dte-dev-app.tar.gz
            docker compose -f docker-compose.dev.yml config -q
            docker compose -f docker-compose.dev.yml down --remove-orphans
            docker volume ls -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter label=com.docker.compose.volume=public-assets | xargs -r docker volume rm
            docker compose -f docker-compose.dev.yml up -d --wait db
            docker compose -f docker-compose.dev.yml run --rm app php artisan migrate --force
            docker compose -f docker-compose.dev.yml up -d
            docker compose -f docker-compose.dev.yml exec -T app php artisan optimize
            docker compose -f docker-compose.dev.yml ps

            # Remove the images of earlier deploys so they don't pile up on the droplet.
            docker images rutely-dte-dev-app --format '{{.Repository}}:{{.Tag}}' \
              | grep -vxF "rutely-dte-dev-app:${APP_IMAGE_TAG}" \
              | xargs -r docker rmi
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_DEBUG: ${{ vars.APP_DEBUG }}
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          APP_LOCALE: ${{ vars.APP_LOCALE }}
          APP_FALLBACK_LOCALE: ${{ vars.APP_FALLBACK_LOCALE }}
          APP_FAKER_LOCALE: ${{ vars.APP_FAKER_LOCALE }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          APP_IMAGE_TAG: ${{ github.sha }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
