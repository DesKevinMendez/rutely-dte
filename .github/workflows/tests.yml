name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      db-testing:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rutelydte_testing
          POSTGRES_USER: rutely
          POSTGRES_PASSWORD: rutely_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rutely -d rutelydte_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      db-e2e:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rutelydte_e2e
          POSTGRES_USER: rutely_e2e
          POSTGRES_PASSWORD: rutely_e2e_local
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U rutely_e2e -d rutelydte_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - name: Resolve test database hosts
        run: echo "127.0.0.1 db-testing db-e2e" | sudo tee -a /etc/hosts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run DTE Signer PHP Checks
        run: |
          vendor/bin/pint --test app/Models/MhCertificates.php app/Services/Dte/FirmadorService.php tests/Feature/Services/Dte/FirmadorServiceTest.php
          vendor/bin/phpstan analyse app/Models/MhCertificates.php app/Services/Dte/FirmadorService.php --no-progress
          php artisan test

      - name: Run Frontend Checks
        run: |
          pnpm lint:check
          pnpm exec prettier --write resources/js/core/types/api.types.ts resources/js/modules/dashboard resources/js/modules/dtes resources/js/modules/queue resources/js/modules/contingency resources/js/modules/certificates resources/js/modules/mh-credentials
          git diff --no-color -- resources/js
          pnpm types:check

      - name: Run Playwright E2E Tests
        env:
          E2E_DB_PORT: 5440
        run: pnpm test:e2e
