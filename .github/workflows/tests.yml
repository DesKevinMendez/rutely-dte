name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        run: corepack enable

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run DTE Signer PHP Checks
        run: |
          vendor/bin/pint --test app/Models/MhCertificates.php app/Services/Dte/FirmadorService.php tests/Feature/Services/Dte/FirmadorServiceTest.php
          vendor/bin/phpstan analyse app/Models/MhCertificates.php app/Services/Dte/FirmadorService.php --no-progress
          php artisan test

      - name: Run Frontend Checks
        run: |
          pnpm lint:check
          pnpm exec prettier --write resources/js/core/types/api.types.ts resources/js/modules/dashboard resources/js/modules/dtes resources/js/modules/queue resources/js/modules/contingency resources/js/modules/certificates resources/js/modules/mh-credentials
          git diff --no-color -- resources/js
          pnpm types:check

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e
