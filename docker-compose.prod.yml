name: rutely-dte-prod

services:
  app:
    image: rutely-dte-prod-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: rutelydteprod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: ["sh", "-c", "cp -a /var/www/public/. /shared-public/ && exec php-fpm"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    volumes:
      - public-assets:/shared-public
      - storage-data:/var/www/storage
    networks:
      - rutely-dte-prod-network

  queue:
    image: rutely-dte-prod-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: rutelydteprodworker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: ["php", "artisan", "queue:work", "--tries=3"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/storage
    networks:
      - rutely-dte-prod-network

  db:
    image: postgres:17-alpine
    container_name: rutelydteproddb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - rutely-dte-prod-network

  webserver:
    image: nginx:alpine
    container_name: rutelydteprodnginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "9001:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/var/www/public:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    networks:
      - rutely-dte-prod-network

networks:
  rutely-dte-prod-network:
    name: rutely-dte-prod-network
    driver: bridge

volumes:
  public-assets:
  postgres-data:
  storage-data:
