name: rutely-dte-dev

services:
  app:
    image: rutely-dte-dev-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: rutelydtedev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: ["sh", "-c", "cp -a /var/www/public/. /shared-public/ && exec php-fpm"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public-assets:/shared-public
      - storage-data:/var/www/storage
    networks:
      - rutely-dte-dev-network

  queue:
    image: rutely-dte-dev-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    container_name: rutelydtedevworker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command: ["php", "artisan", "queue:work", "--tries=3"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage-data:/var/www/storage
    networks:
      - rutely-dte-dev-network

  db:
    image: postgres:17-alpine
    container_name: rutelydtedevdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - rutely-dte-dev-network

  webserver:
    image: nginx:alpine
    container_name: rutelydtedevnginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8183:80"
      - "8445:443"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - public-assets:/var/www/public:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    networks:
      - rutely-dte-dev-network

networks:
  rutely-dte-dev-network:
    name: rutely-dte-dev-network
    driver: bridge

volumes:
  public-assets:
  postgres-data:
  storage-data:
