name: rutelydte

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  working_dir: /var/www
  env_file:
    - path: .env
      required: false
  environment:
    APP_NAME: rutelydte
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:9002
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-rutelydte}
    DB_USERNAME: ${DB_USERNAME:-rutely}
    DB_PASSWORD: ${DB_PASSWORD:-rutely_local}
    QUEUE_CONNECTION: database
  volumes:
    - ./:/var/www
    - ./vendor:/var/www/vendor
    - node_data:/var/www/node_modules
    - public_build:/var/www/public/build
    - storage_data:/var/www/storage
    - bootstrap_cache_data:/var/www/bootstrap/cache
    - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
  networks:
    - rutelydte-network

services:
  rutelydte:
    <<: *app
    container_name: rutelydte
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f .env ]; then cp .env.example .env; fi
        if ! grep -qE '^APP_KEY=.+' .env; then php artisan key:generate --force; fi
        php artisan migrate --force
        exec php-fpm
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    container_name: rutelydteworker
    depends_on:
      rutelydte:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--tries=3"]
    networks:
      rutelydte-network:
        aliases:
          - rutelydteworker

  db:
    image: postgres:17-alpine
    container_name: rutelydtedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rutelydte}
      POSTGRES_USER: ${DB_USERNAME:-rutely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rutely_local}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      rutelydte-network:
        aliases:
          - rutelydtedb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-testing:
    image: postgres:17-alpine
    container_name: rutelydtedbtesting
    profiles:
      - testing
    restart: unless-stopped
    environment:
      POSTGRES_DB: rutelydte_testing
      POSTGRES_USER: ${DB_USERNAME:-rutely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rutely_local}
    ports:
      - "127.0.0.1:${DB_TEST_FORWARD_PORT:-5439}:5432"
    volumes:
      - postgres_testing_data:/var/lib/postgresql/data
    networks:
      rutelydte-network:
        aliases:
          - rutelydtedbtesting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test:
    <<: *app
    container_name: rutelydte-test
    profiles:
      - testing
    restart: "no"
    depends_on:
      db-testing:
        condition: service_healthy
    environment:
      APP_NAME: rutelydte
      APP_ENV: testing
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db-testing
      DB_PORT: 5432
      DB_DATABASE: rutelydte_testing
      DB_USERNAME: ${DB_USERNAME:-rutely}
      DB_PASSWORD: ${DB_PASSWORD:-rutely_local}
    command: ["php", "artisan", "test", "--compact"]

  nginx:
    image: nginx:alpine
    container_name: rutelydtenginx
    restart: unless-stopped
    depends_on:
      rutelydte:
        condition: service_healthy
    ports:
      - "9002:80"
    volumes:
      - ./:/var/www:ro
      - public_build:/var/www/public/build:ro
      - storage_data:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rutelydte-network

volumes:
  node_data:
  public_build:
  storage_data:
  bootstrap_cache_data:
  postgres_data:
  postgres_testing_data:

networks:
  rutelydte-network:
    name: rutelydte-network
    driver: bridge
